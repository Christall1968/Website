name: Build and deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build static site data
        run: npm run build
        env:
          PUBLIC_SITE_URL: https://beautiful-flowers.de

      - name: Prepare Pages artifact
        run: |
          mkdir _site
          rsync -a \
            --exclude='*.DS_Store' \
            --exclude='/.gitignore' \
            --exclude='/content/company/images/design vorlage.jpeg' \
            --exclude='/content/company/images/hero-1.svg' \
            --exclude='/content/company/images/hero-2.svg' \
            --exclude='/.git/' \
            --exclude='/.github/' \
            --exclude='/.idea/' \
            --exclude='/scripts/' \
            --exclude='/README.md' \
            --exclude='/package.json' \
            --exclude='/_site/' \
            ./ _site/

      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
